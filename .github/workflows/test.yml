name: Temp Numbers Login Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run login + gen-stats test
        env:
          LOGIN_URL: https://tempnumbers.net/login
          TARGET_URL: https://tempnumbers.net/gen-stats
          PANEL_USER: test_panel
          PANEL_PASS: test_panel
        run: python test_login.py

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            *.png
          if-no-files-found: ignore
